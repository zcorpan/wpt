<!doctype html>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
async_test(t => {
  const url = new URL(location.href);
  url.hash = "#from-sandboxed";
  navigation.onnavigate = t.step_func_done(e => {
    assert_equals(e.destination.url, url.href, "destination.url");
    assert_equals(e.sourceElement, null, "sourceElement");
  });
  const iframe = document.createElement("iframe");
  iframe.sandbox = "allow-scripts allow-top-navigation";
  iframe.srcdoc = `<a href="${url.href}" target="_top">link</a>` +
                  `<script>document.querySelector("a").click();<\/script>`;
  document.body.append(iframe);
}, "NavigateEvent.sourceElement should be null for an initiator in an opaque-origin document");
</script>
